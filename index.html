<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer Brain Games</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161616; --paper:#ffffff; --bg:#f4f4f4;
  --blue:#0f62fe; --green:#24a148; --red:#da1e28; --yellow:#f1c21b; --purple:#8a3ffc; --teal:#009d9a;
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#e5f0ff 0%,#f4f4f4 60%);font-size:clamp(18px,2.2vw,28px)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--ink);color:#fff}
header h1{font-size:1em;margin:0;font-weight:700;flex:1;letter-spacing:.2px}
header button{background:#393939;color:#fff;padding:8px 16px;border-radius:999px;font-size:.7em;font-weight:600}
header button:hover{background:#525252}
main{max-width:1280px;margin:0 auto;padding:20px 24px 40px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius);padding:24px 28px;box-shadow:0 6px 0 var(--ink)}
.center{text-align:center}
h2{font-size:1.9em;margin:.1em 0 .3em;line-height:1.15}
p{margin:.3em 0 .8em;line-height:1.35}
.big-emoji{font-size:clamp(70px,12vw,140px);line-height:1}
.bob{height:clamp(90px,14vw,150px);width:auto;display:block;margin:0 auto}

/* buttons */
.btn{padding:.6em 1.4em;border-radius:16px;font-weight:700;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  background:var(--yellow);transition:transform .08s, box-shadow .08s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.yes{background:var(--green);color:#fff;font-size:1.5em;min-width:min(42vw,260px)}
.btn.no{background:var(--red);color:#fff;font-size:1.5em;min-width:min(42vw,260px)}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* home */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;margin-top:24px}
.game-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:30px 24px;border-radius:var(--radius);
  border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink);background:#fff;transition:transform .12s}
.game-card:hover{transform:translateY(-4px)}
.game-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.game-card.a{background:#d0e2ff}.game-card.b{background:#defbe6}
.game-card .t{font-size:1.5em;font-weight:700}
.game-card .d{font-size:.8em}

/* animal game */
.two-col{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:24px;align-items:start}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.question{font-size:clamp(28px,4.4vw,56px);font-weight:700;line-height:1.15;margin:.2em 0 .4em}
.brain{background:#fff;border:3px solid var(--ink);border-radius:var(--radius);padding:18px 20px;box-shadow:0 6px 0 var(--ink)}
.brain h3{margin:0 0 8px;font-size:1em}
.brain ol{list-style:none;margin:0;padding:0;font-size:.72em;display:flex;flex-direction:column;gap:8px}
.brain li{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 12px;animation:pop .3s}
.chip{font-weight:700;color:#fff;border-radius:999px;padding:2px 12px;font-size:.9em}
.chip.y{background:var(--green)}.chip.n{background:var(--red)}
.brain .count{margin-top:12px;font-size:.7em;opacity:.8}
.field{width:100%;font:inherit;font-size:1.1em;padding:.5em .7em;border:3px solid var(--ink);border-radius:14px;margin:8px 0}
.small{font-size:.75em}
.growbox{background:#e8daff;border:3px dashed var(--purple);border-radius:16px;padding:12px 16px;margin-top:14px;font-size:.8em}

/* robot game */
.robot-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,1fr);gap:26px;align-items:start}
@media(max-width:900px){.robot-wrap{grid-template-columns:1fr}}
.board{position:relative;width:min(100%,62vh,560px);aspect-ratio:1;margin:0 auto;border:4px solid var(--ink);border-radius:18px;overflow:hidden;
  display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);background:#fff;box-shadow:0 6px 0 var(--ink)}
.cell{border:1px solid #c6c6c6;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,6vw,64px)}
.cell:nth-child(odd){background:#f0f7ff}
.robot{position:absolute;width:20%;height:20%;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,7vw,72px);
  transition:left .38s ease,top .38s ease;pointer-events:none}
.robot.bonk{animation:shake .4s}
.robot.win{animation:hop .5s 3}
.prog{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.blkwrap{position:relative}
.blk{width:clamp(56px,7vw,84px);height:clamp(56px,7vw,84px);border-radius:16px;border:3px solid var(--ink);background:var(--blue);color:#fff;
  font-size:1.7em;font-weight:700;box-shadow:0 5px 0 var(--ink)}
.blk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.blk.active{background:var(--yellow);color:var(--ink);transform:scale(1.15)}
.blk.badstep{background:var(--red)}
.del{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-size:14px;font-weight:700;line-height:1;padding:0}
.add{background:#fff;color:var(--ink);border-style:dashed;box-shadow:none}
.msg{min-height:3.2em;font-weight:600;font-size:.95em;padding:12px 16px;border-radius:14px;background:var(--bg);border:3px solid var(--ink)}
.msg.good{background:#defbe6}.msg.bad{background:#fff1f1}
.dots{display:flex;gap:8px;margin-bottom:6px}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dot.now{background:var(--yellow)}.dot.done{background:var(--green)}
.bug{display:inline-block;animation:wiggle 1s infinite}
.picker{flex-basis:100%;background:#fff8d6;border:3px dashed var(--ink);border-radius:16px;padding:12px 14px}
.picker-label{font-weight:700;font-size:.8em;margin-bottom:10px}
.picker-btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pick{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 14px;min-width:84px;display:flex;flex-direction:column;align-items:center;font-size:1.7em;font-weight:700;box-shadow:0 4px 0 var(--ink)}
.pick small{font-size:.42em;font-weight:600}
.pick:hover{background:#edf5ff}
.pick.cancel{background:#e0e0e0;font-size:.8em;min-width:0;padding:10px 16px}


@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-22%)}}
@keyframes wiggle{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.confetti{position:fixed;top:-60px;font-size:34px;z-index:20;pointer-events:none;animation:fall 2.6s linear forwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <span style="font-size:1.3em">🧠</span>
  <h1>Computer Brain Games</h1>
  <button id="homeBtn" title="Back to start">🏠 Home</button>
</header>
<main id="app"></main>

<script>
/* ---------- helpers ---------- */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let runToken = 0;

let actx;
function beep(freqs, dur=.12){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach(f=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type='square'; o.frequency.value=f; g.gain.value=.05;
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+dur); t += dur;
    });
  }catch(e){}
}
function confetti(){
  const bits = ['🎉','⭐','🎈','✨','🌟','🎊'];
  for(let i=0;i<36;i++){
    const s = document.createElement('span');
    s.className='confetti'; s.textContent=bits[i%bits.length];
    s.style.left=Math.random()*100+'vw'; s.style.animationDelay=Math.random()*.8+'s';
    s.style.fontSize=(24+Math.random()*28)+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),3800);
  }
}
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

document.getElementById('homeBtn').onclick = () => { runToken++; home(); };

/* =====================================================
   GAME 1: GUESS MY ANIMAL  (a decision tree that learns)
   ===================================================== */
const L = (a,e) => ({a,e});
const DEFAULT_TREE = () => ({
  q:'Does it live in water?',
  yes:{ q:'Is it really, really big?', yes:L('whale','🐋'), no:L('fish','🐟') },
  no:{ q:'Can it fly?',
    yes:{ q:'Does it buzz?', yes:L('bee','🐝'), no:L('bird','🐦') },
    no:{ q:'Does it have four legs?',
      yes:{ q:'Is it a pet?',
        yes:{ q:'Does it say "meow"?', yes:L('cat','🐱'), no:L('dog','🐶') },
        no:{ q:'Does it have a very long neck?', yes:L('giraffe','🦒'), no:L('elephant','🐘') } },
      no:{ q:'Does it hop?', yes:L('frog','🐸'), no:L('snake','🐍') } } }
});
const EMOJI = {cow:'🐮',pig:'🐷',horse:'🐴',lion:'🦁',tiger:'🐯',bear:'🐻',monkey:'🐵',rabbit:'🐰',bunny:'🐰',mouse:'🐭',duck:'🦆',chicken:'🐔',
  owl:'🦉',penguin:'🐧',shark:'🦈',dolphin:'🐬',octopus:'🐙',turtle:'🐢',butterfly:'🦋',spider:'🕷️',ant:'🐜',snail:'🐌',zebra:'🦓',
  kangaroo:'🦘',panda:'🐼',koala:'🐨',fox:'🦊',wolf:'🐺',deer:'🦌',sheep:'🐑',goat:'🐐',crab:'🦀',whale:'🐋',unicorn:'🦄',dinosaur:'🦖',
  crocodile:'🐊',alligator:'🐊',hippo:'🦛',rhino:'🦏',camel:'🐪',squirrel:'🐿️',bat:'🦇',eagle:'🦅',parrot:'🦜',swan:'🦢',flamingo:'🦩',
  ladybug:'🐞',worm:'🪱',jellyfish:'🪼',seal:'🦭',otter:'🦦',sloth:'🦥',hamster:'🐹',lizard:'🦎',dragon:'🐉'};
const emojiFor = n => { const k = n.toLowerCase().trim().replace(/s$/,''); return EMOJI[k] || EMOJI[n.toLowerCase().trim()] || '🐾'; };
const aOrAn = w => /^[aeiou]/i.test(w) ? 'an' : 'a';
const countAnimals = n => n.a ? 1 : countAnimals(n.yes) + countAnimals(n.no);

let tree, G;
function loadTree(){ try{ const s = store.get('cbg-tree'); if(s) return JSON.parse(s); }catch(e){} return DEFAULT_TREE(); }
const saveTree = () => store.set('cbg-tree', JSON.stringify(tree));

function startAnimal(){
  tree = loadTree();
  G = { node:tree, parent:null, side:null, path:[] };
  viewThink();
}
function brainPanel(extra=''){
  const items = G.path.map(p => `<li><span>${esc(p.q)}</span><span class="chip ${p.a?'y':'n'}">${p.a?'YES':'NO'}</span></li>`).join('');
  return `<aside class="brain">
    <h3>🧠 What my brain is doing</h3>
    ${items ? `<ol>${items}</ol>` : '<p class="small">Waiting for you to think of an animal…</p>'}
    ${extra}
    <div class="count">I know <b>${countAnimals(tree)}</b> animals.</div>
  </aside>`;
}
function viewThink(){
  app.innerHTML = `<div class="two-col">
    <section class="card center">
      <div class="big-emoji">🤔</div>
      <h2>Think of an animal!</h2>
      <p>Keep it a <b>secret</b> in your head. I'll ask yes-or-no questions.</p>
      <div class="row"><button class="btn blue" style="font-size:1.4em" id="ready">I'm ready! 🚀</button></div>
    </section>${brainPanel()}</div>`;
  document.getElementById('ready').onclick = viewAsk;
}
function viewAsk(){
  const n = G.node;
  if(n.a) return viewGuess();
  app.innerHTML = `<div class="two-col">
    <section class="card center">
      <div class="question">${esc(n.q)}</div>
      <div class="row">
        <button class="btn yes" id="y">👍 YES</button>
        <button class="btn no" id="n">👎 NO</button>
      </div>
    </section>${brainPanel()}</div>`;
  document.getElementById('y').onclick = () => answer(true);
  document.getElementById('n').onclick = () => answer(false);
}
function answer(a){
  const n = G.node;
  G.path.push({q:n.q, a});
  G.parent = n; G.side = a ? 'yes' : 'no';
  G.node = n[G.side];
  beep([a?660:330]);
  viewAsk();
}
function viewGuess(){
  const n = G.node;
  const text = `Is it ${aOrAn(n.a)} ${n.a}?`;
  app.innerHTML = `<div class="two-col">
    <section class="card center">
      <div class="big-emoji">${n.e}</div>
      <div class="question">${esc(text)}</div>
      <div class="row">
        <button class="btn yes" id="y">👍 YES!</button>
        <button class="btn no" id="n">👎 NO</button>
      </div>
    </section>${brainPanel()}</div>`;
  document.getElementById('y').onclick = viewWin;
  document.getElementById('n').onclick = () => viewLearn1();
}
function viewWin(){
  confetti(); beep([523,659,784,1047]);
  const n = G.node;
  app.innerHTML = `<div class="two-col">
    <section class="card center">
      <div class="big-emoji">${n.e}</div>
      <h2>I got it! 🎉</h2>
      <p>I followed my questions step by step, just like an app does.</p>
      <div class="row">
        <button class="btn blue" id="again">Play again 🔁</button>
        <button class="btn ghost" id="home">Other game 🤖</button>
      </div>
    </section>${brainPanel()}</div>`;
  document.getElementById('again').onclick = startAnimal;
  document.getElementById('home').onclick = () => startRobot(0);
}
let LR = {};
function viewLearn1(){
  const n = G.node;
  LR = { old:n };
  app.innerHTML = `<div class="two-col">
    <section class="card">
      <div class="big-emoji center">😮</div>
      <h2 class="center">You stumped me!</h2>
      <p>What animal were you thinking of?</p>
      <input class="field" id="name" maxlength="24" placeholder="Type the animal here…" autocomplete="off">
      <div class="row"><button class="btn blue" id="next">Next ➜</button></div>
    </section>${brainPanel()}</div>`;
  const inp = document.getElementById('name'); inp.focus();
  const go = () => { const v = inp.value.trim(); if(!v){ inp.focus(); return; } LR.name = v; LR.e = emojiFor(v); viewLearn2(); };
  document.getElementById('next').onclick = go;
  inp.onkeydown = e => { if(e.key==='Enter') go(); };
}
function viewLearn2(){
  const o = LR.old;
  app.innerHTML = `<div class="two-col">
    <section class="card">
      <div class="center" style="font-size:3em">${LR.e} <span style="opacity:.5">vs</span> ${o.e}</div>
      <p>Teach me! Write a question that is different for <b>${esc(LR.name)}</b> and <b>${esc(o.a)}</b>.</p>
      <input class="field" id="q" maxlength="70" placeholder="Example: Does it have stripes?" autocomplete="off">
      <div class="row"><button class="btn blue" id="next">Next ➜</button></div>
    </section>${brainPanel()}</div>`;
  const inp = document.getElementById('q'); inp.focus();
  const go = () => { let v = inp.value.trim(); if(!v){ inp.focus(); return; } if(!/[?]$/.test(v)) v += '?'; LR.q = v; viewLearn3(); };
  document.getElementById('next').onclick = go;
  inp.onkeydown = e => { if(e.key==='Enter') go(); };
}
function viewLearn3(){
  app.innerHTML = `<div class="two-col">
    <section class="card center">
      <div class="big-emoji">${LR.e}</div>
      <p>For <b>${esc(LR.name)}</b>, what's the answer to…</p>
      <div class="question" style="font-size:clamp(24px,3.4vw,44px)">${esc(LR.q)}</div>
      <div class="row">
        <button class="btn yes" id="y">👍 YES</button>
        <button class="btn no" id="n">👎 NO</button>
      </div>
    </section>${brainPanel()}</div>`;
  document.getElementById('y').onclick = () => learn(true);
  document.getElementById('n').onclick = () => learn(false);
}
function learn(ans){
  const nl = L(LR.name.toLowerCase(), LR.e), ol = LR.old;
  const node = { q:LR.q, yes: ans ? nl : ol, no: ans ? ol : nl };
  if(G.parent) G.parent[G.side] = node; else tree = node;
  saveTree();
  confetti(); beep([392,523,659]);
  app.innerHTML = `<div class="two-col">
    <section class="card center">
      <div class="big-emoji">🧠✨</div>
      <h2>Now I know ${aOrAn(LR.name)} ${esc(LR.name)}!</h2>
      <p>I added your question to my brain. Try me again with the same animal!</p>
      <div class="growbox">My brain grew to <b>${countAnimals(tree)}</b> animals.</div>
      <div class="row">
        <button class="btn blue" id="again">Play again 🔁</button>
        <button class="btn ghost" id="reset">Forget what I learned 🗑️</button>
      </div>
    </section>${brainPanel()}</div>`;
  document.getElementById('again').onclick = startAnimal;
  document.getElementById('reset').onclick = () => { store.del('cbg-tree'); startAnimal(); };
}

function placeRobot(){
  const r = document.getElementById('robot');
  r.style.left = R.pos[0]*20 + '%'; r.style.top = R.pos[1]*20 + '%';
}
function drawProg(activeIdx=-1){
  const p = document.getElementById('prog'); p.innerHTML = '';
  R.prog.forEach((d,k)=>{
    const w = document.createElement('div'); w.className='blkwrap';
    const b = document.createElement('button');
    b.className = 'blk' + (k===activeIdx?' active':'') + (k===R.failStep?' badstep':'');
    b.textContent = ARROW_TXT[d]; b.setAttribute('aria-label','Step '+(k+1)+': '+d);
    b.disabled = R.running;
    b.onclick = () => { R.prog[k] = ORDER[(ORDER.indexOf(d)+1)%4]; R.failStep=-1; resetRobot(); drawProg(); beep([500]); };
    const x = document.createElement('button'); x.className='del'; x.textContent='✖'; x.setAttribute('aria-label','Remove step '+(k+1));
    x.disabled = R.running;
    x.onclick = () => { R.prog.splice(k,1); R.failStep=-1; resetRobot(); drawProg(); beep([300]); };
    w.append(b,x); p.appendChild(w);
  });
  if(R.prog.length < 14){
    if(R.picking){
      const names = {U:'up',R:'right',D:'down',L:'left'};
      const pk = document.createElement('div'); pk.className='picker';
      pk.innerHTML = '<div class="picker-label">Pick the direction for the NEW step:</div>';
      const btns = document.createElement('div'); btns.className='picker-btns';
      ORDER.forEach(d=>{
        const b = document.createElement('button'); b.className='pick';
        b.innerHTML = '<span>'+ARROW_TXT[d]+'</span><small>'+names[d]+'</small>';
        b.setAttribute('aria-label','Add step: move '+names[d]);
        b.disabled = R.running;
        b.onclick = () => { R.prog.push(d); R.picking=false; R.failStep=-1; resetRobot(); drawProg(); beep([600]); };
        btns.appendChild(b);
      });
      const c = document.createElement('button'); c.className='pick cancel'; c.textContent='Cancel'; c.setAttribute('aria-label','Cancel adding a step');
      c.onclick = () => { R.picking=false; drawProg(); };
      btns.appendChild(c);
      pk.appendChild(btns); p.appendChild(pk);
    } else {
      const a = document.createElement('button'); a.className='blk add'; a.textContent='＋'; a.setAttribute('aria-label','Add a step');
      a.disabled = R.running;
      a.onclick = () => { R.picking = true; drawProg(); beep([600]); };
      p.appendChild(a);
    }
  }
}
function resetRobot(){
  R.pos = R.lv.start.slice(); placeRobot();
  const m = document.getElementById('msg'); m.className='msg'; m.innerHTML = 'Changed something? Press ▶ <b>Run</b> to test it!';
}
function setMsg(html, cls=''){ const m = document.getElementById('msg'); m.className='msg '+cls; m.innerHTML = html; }

async function runProg(){
  if(R.running) return;
  const token = ++runToken;
  R.running = true; R.failStep = -1;
  R.pos = R.lv.start.slice(); placeRobot();
  const robot = document.getElementById('robot');
  robot.classList.remove('bonk','win');
  document.getElementById('run').disabled = true;
  setMsg('Running… 🏃');
  await sleep(500);
  let fail = null;
  for(let k=0;k<R.prog.length;k++){
    if(token !== runToken) return;
    drawProg(k);
    const d = DELTA[R.prog[k]];
    const nx = R.pos[0]+d[0], ny = R.pos[1]+d[1];
    const wall = nx<0||ny<0||nx>4||ny>4;
    const rock = R.lv.rocks.some(r=>r[0]===nx&&r[1]===ny);
    if(wall || rock){
      robot.classList.add('bonk'); beep([200,160],.15);
      fail = {k, why: wall ? 'bumped into the wall' : 'bumped into a rock 🪨'};
      await sleep(600); break;
    }
    R.pos = [nx,ny]; placeRobot(); beep([440+k*40],.08);
    await sleep(650);
  }
  if(token !== runToken) return;
  R.running = false;
  const atStar = R.pos[0]===R.lv.star[0] && R.pos[1]===R.lv.star[1];
  if(!fail && atStar){
    robot.classList.add('win'); confetti(); beep([523,659,784,1047],.14);
    const last = R.i === LEVELS.length-1;
    setMsg(`🎉 <b>You fixed the bug!</b> The robot reached the star.<br><span class="small">Debugging = test, find the problem, fix, test again.</span>`, 'good');
    R.prog.length && drawProg();
    const row = document.createElement('div'); row.className='row'; row.style.justifyContent='flex-start';
    row.innerHTML = last
      ? `<button class="btn blue" id="nx">🏠 All done! Home</button><button class="btn ghost" id="rp">Play again 🔁</button>`
      : `<button class="btn blue" id="nx">Next level ➜</button>`;
    document.getElementById('msg').after(row);
    document.getElementById('nx').onclick = () => last ? home() : startRobot(R.i+1);
    if(last) document.getElementById('rp').onclick = () => startRobot(0);
  } else {
    R.failStep = fail ? fail.k : R.prog.length-1;
    drawProg();
    const why = fail ? `The robot ${fail.why} on <b>step ${fail.k+1}</b>.` : `The robot stopped, but it is <b>not on the star</b>.`;
    setMsg(`🐛 <b>Bug found!</b> ${why}<br><span class="small">Which step would you change? Fix it and press ▶ Run.</span>`, 'bad');
    document.getElementById('run').disabled = false;
    robot.classList.remove('bonk');
  }
  document.getElementById('run').disabled = false;
}

home();
</script>

</html>
